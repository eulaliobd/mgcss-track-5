name: Automate Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Construir, Testear y Analizar en SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=eulaliobd_mgcss-track-5 -Dsonar.organization=eulaliobd

      - name: Construir imagen Docker
        run: docker build -t mgcss-track:${{ github.ref_name }} .

      - name: Crear Release y adjuntar artefacto
        uses: softprops/action-gh-release@v2
        with:
          files: target/*.jar
          generate_release_notes: true