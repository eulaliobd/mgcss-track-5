name: CI Pipeline

on:
  push:
    branches: [ "main", "feature/**", "fix/**", "feat/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout del codigo
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Configurar JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build and analyze
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: mvn clean verify sonar:sonar -Dsonar.projectKey=eulaliobd_mgcss-track-5 -Dsonar.organization=eulaliobd -Dsonar.host.url=https://sonarcloud.io
